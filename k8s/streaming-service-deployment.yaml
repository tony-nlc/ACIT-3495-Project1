apiVersion: apps/v1
kind: Deployment
metadata:
  name: streaming-service
  namespace: video-streaming
spec:
  replicas: 2
  selector:
    matchLabels:
      app: streaming-service
  template:
    metadata:
      labels:
        app: streaming-service
    spec:
      containers:
      - name: streaming-service
        image: streaming-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5002
        env:
        - name: DB_DSN
          value: "video_user:video_pass@tcp(mysql-service:3306)/video_db"
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: JWT_SECRET_KEY
        - name: PORT
          value: "5002"
        volumeMounts:
        - name: video-storage
          mountPath: /storage
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: video-storage
        persistentVolumeClaim:
          claimName: video-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: streaming-service
  namespace: video-streaming
spec:
  type: ClusterIP
  selector:
    app: streaming-service
  ports:
  - port: 5002
    targetPort: 5002
    name: http